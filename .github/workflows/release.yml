name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.0.0-test)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest, rid: osx-arm64 }
          - { name: macos-x64, os: macos-latest, rid: osx-x64 }
          - { name: linux-x64, os: ubuntu-latest }
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "$env:VERSION"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh "$VERSION" "${{ matrix.rid }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeApps.Desktop-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="v${VERSION#v}"
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes "${flags[@]}" \
              ${{ github.event_name == 'workflow_dispatch' && format('--target {0}', github.sha) || '' }}
          fi
